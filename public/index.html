<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Claude Remote</title>
<style>
:root {
  --bg: #ffffff; --side: #f7f7f8; --panel: #ffffff; --text: #1f2329; --text2: #4e5561; --muted: #8a919c;
  --border: #ebedf0; --hover: #eef0f3; --active: #e6eaf2; --accent: #4d6bfe; --accent-soft: #eef1ff;
  --bubble: #eef1ff; --code: #f5f6f8; --ok: #1f9d55; --bad: #e5484d; --warn-bg: #fff8e6; --warn-border: #f3d27a;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18191b; --side: #1f2023; --panel: #232427; --text: #e8eaed; --text2: #c0c4cc; --muted: #8b9099;
    --border: #2f3134; --hover: #2a2c30; --active: #30343c; --accent: #7b93ff; --accent-soft: #262c45;
    --bubble: #2a3150; --code: #26282c; --ok: #4cc38a; --bad: #ff6369; --warn-bg: #372f1c; --warn-border: #7a6125;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
.iconbtn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text2); }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.spin { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

#app { display: flex; height: 100%; }

/* ---------- 左侧栏 ---------- */
#side { width: 300px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: margin .2s; }
#app.side-collapsed #side { margin-left: -300px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 14px 12px 18px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
.brand .logo svg { width: 18px; height: 18px; }
.brand .name { flex: 1; min-width: 0; line-height: 1.25; }
.brand .name b { display: block; font-size: 15px; }
.brand .ver { display: inline-block; margin-top: 2px; font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--text); color: var(--bg); }
.newchat { margin: 4px 12px 10px; height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.newchat:hover { border-color: var(--accent); color: var(--accent); }
.sec { display: flex; align-items: center; padding: 10px 10px 4px 18px; color: var(--muted); font-size: 14px; }
.sec span { flex: 1; }
#search { margin: 4px 12px 6px; display: none; }
#search input { width: 100%; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); padding: 0 10px; outline: none; }
#search input:focus { border-color: var(--accent); }
#tree { flex: 1; overflow-y: auto; padding: 2px 8px 10px; }
.ws { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.ws:hover { background: var(--hover); }
.ws.cur .wsname { color: var(--accent); }
.ws .wsname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .acts { display: none; }
.ws:hover .acts { display: flex; }
.ws .acts .iconbtn { width: 26px; height: 26px; }
.sess { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 14px; margin-left: 4px; border-radius: 8px; cursor: pointer; }
.sess:hover { background: var(--hover); }
.sess.active { background: var(--active); }
.sess .lead { width: 14px; display: inline-flex; }
.sess .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess .ago { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.more { padding: 4px 10px 8px 40px; color: var(--muted); font-size: 13px; cursor: pointer; }
.more:hover { color: var(--text); }
.disc { padding: 6px 10px 2px 18px; color: var(--muted); font-size: 12px; }
.discrow { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 18px; font-size: 12.5px; color: var(--text2); }
.discrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.discrow button { color: var(--accent); font-size: 12px; }
/* 左下角：套餐用量 */
.usage { border-top: 1px solid var(--border); padding: 10px 14px 8px; font-size: 13px; }
.uhead { display: flex; align-items: center; color: var(--text2); font-weight: 600; margin-bottom: 4px; }
.uhead span { flex: 1; }
.uhead .iconbtn { width: 26px; height: 26px; }
.uhead .iconbtn svg.i { width: 15px; height: 15px; }
.ulim { margin: 6px 0 8px; }
.ulim .ut { display: flex; align-items: baseline; gap: 6px; }
.ulim .ut b { font-weight: 500; flex: 1; }
.ulim .ut .up { font-variant-numeric: tabular-nums; font-weight: 600; }
.ulim .ubar { height: 6px; border-radius: 3px; background: var(--hover); margin: 4px 0 3px; overflow: hidden; }
.ulim .ubar div { height: 100%; border-radius: 3px; background: var(--accent); }
.ulim.warn .ubar div { background: #d9822b; }
.ulim.full .ubar div { background: var(--bad); }
.ulim .ur { color: var(--muted); font-size: 11.5px; }
.ulim.sub { margin: 4px 0 6px; }
.ulim.sub .ut b { font-weight: 400; color: var(--text2); }
.unote { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.ufoot { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.ufoot .grow { flex: 1; }
.ubtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); font-size: 13px; }
.ubtn:hover, .ubtn.on { border-color: var(--accent); color: var(--accent); }
.ubtn svg.i { width: 15px; height: 15px; }

/* 工具返回的图片 */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px 26px; }
.thumbs img { max-width: min(420px, 100%); max-height: 300px; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; background: #fff; object-fit: contain; }
#lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(10, 12, 16, .85); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
#lightbox[hidden] { display: none; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }

/* Token 统计窗口 */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(15, 18, 25, .4); display: flex; align-items: center; justify-content: center; padding: 28px; }
.modal[hidden] { display: none; }
/* 设置窗口式布局：标题栏 + 左侧分类 + 右侧内容。外框负责圆角并裁掉溢出，右侧 .sp 单独滚动 */
.mbox { position: relative; width: min(1100px, 100%); height: min(780px, 100%); display: flex; flex-direction: column; overflow: hidden; background: var(--bg); border-radius: 28px; box-shadow: 0 24px 70px rgba(0,0,0,.22); }
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 28px 28px 12px 40px; flex-shrink: 0; }
.mhead h2 { margin: 0; font-size: 22px; font-weight: 650; }
.mclose { width: 36px; height: 36px; }
.mclose .i { width: 20px; height: 20px; }
.mbody { flex: 1; min-height: 0; display: flex; gap: 28px; padding: 0 0 0 24px; }
.mnav { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 8px 0 24px; overflow-y: auto; }
.mnav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border-radius: 14px; font-size: 15px; color: var(--text); text-align: left; }
.mnav button .i { width: 19px; height: 19px; color: var(--text2); }
.mnav button:hover { background: var(--hover); }
.mnav button.on { background: var(--active); font-weight: 600; }
.sp { padding: 4px 32px 32px 4px; flex: 1; min-width: 0; min-height: 0; overflow-y: auto; }
/* 设置项式的一行：左边标题和说明，右边控件 */
.srow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
.srow .st1 { font-size: 15.5px; }
.srow .st2 { color: var(--muted); font-size: 13px; margin-top: 4px; }
.srow.plain { border-bottom: 1px solid var(--border); }
.srow .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* QQ 机器人设置 */
.qdot { width: 7px; height: 7px; border-radius: 50%; background: transparent; margin-left: -2px; }
.qdot.ready { background: #22a06b; }
.qdot.warn { background: #e2a03f; }
.qdot.bad { background: #d9534f; }
.sel { height: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--hover); color: var(--text); font-size: 14px; max-width: 320px; }
.inp { height: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; width: 260px; max-width: 100%; }
.btn.danger { color: #d9534f; }
.btn.danger:hover { border-color: #d9534f; }
.sw { position: relative; width: 46px; height: 26px; border-radius: 13px; background: var(--border); transition: background .15s; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
.sw.on { background: var(--text); }
.sw.on::after { left: 23px; }
.qstate { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.qstate .qdot { width: 9px; height: 9px; margin: 0; background: var(--muted); }
.qr { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; padding: 18px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); margin-bottom: 18px; }
.qr .qimg { width: 200px; height: 200px; border-radius: 12px; background: #fff; padding: 8px; display: flex; align-items: center; justify-content: center; }
.qr .qimg svg { width: 100%; height: 100%; }
.qr .qtxt { flex: 1; min-width: 200px; color: var(--text2); font-size: 14px; line-height: 1.8; }
.qr .qtxt b { color: var(--text); font-size: 16px; }
.plist { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 18px; }
.plist .pi { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
.plist .pi:last-child { border-bottom: 0; }
.plist .pi .grow { flex: 1; min-width: 0; }
.plist .pi .sub { color: var(--muted); font-size: 12.5px; }
.plist .tagown { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.pcode { font-size: 30px; font-weight: 700; letter-spacing: 6px; font-variant-numeric: tabular-nums; }
.qwarn { border-radius: 14px; background: var(--accent-soft); color: var(--text2); padding: 12px 16px; font-size: 13.5px; line-height: 1.7; margin-bottom: 18px; }
.sec-title { font-size: 15.5px; margin: 4px 0 12px; }
.sec-title .sub { color: var(--muted); font-size: 13px; margin-left: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { padding: 6px 14px; font-size: 13.5px; color: var(--text2); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--panel); }
.kpi .kl { color: var(--muted); font-size: 12.5px; }
.kpi .kv { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .ks { color: var(--muted); font-size: 12px; margin-top: 2px; }
.kpi.hero .kv { color: var(--accent); }
.card { border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 14px 16px; margin-bottom: 16px; }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.card .sub { color: var(--muted); font-size: 12.5px; font-weight: 400; margin-left: 8px; }
.chart { position: relative; height: 200px; margin: 6px 0 0 44px; }
.chart .grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
.chart .grid span { position: absolute; right: calc(100% + 8px); top: -9px; color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
.chart .bw { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; min-width: 0; }
.chart .b { width: 100%; max-width: 28px; margin: 0 auto; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
.chart .bw:hover .b { filter: brightness(1.15); }
.chart .bw.zero .b { background: transparent; }
.xlab { display: flex; justify-content: space-between; margin: 6px 0 0 44px; color: var(--muted); font-size: 11.5px; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 150px; }
.tip b { display: block; margin-bottom: 2px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; color: var(--text2); font-variant-numeric: tabular-nums; }
table.st { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.st th { text-align: right; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.st td { text-align: right; padding: 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.st th:first-child, table.st td:first-child { text-align: left; white-space: normal; word-break: break-all; }
table.st tr:last-child td { border-bottom: 0; }
table.st td.money { font-weight: 600; }
.twrap { overflow-x: auto; }
.prices p { color: var(--text2); font-size: 13px; line-height: 1.7; margin: 0 0 12px; }

/* ---------- 主区域 ---------- */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#top { border-bottom: 1px solid var(--border); padding: 10px 20px 0 24px; }
.toprow { display: flex; align-items: center; gap: 14px; min-height: 40px; }
#title { font-size: 17px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chips { display: flex; gap: 14px; color: var(--text2); font-size: 14px; flex-shrink: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip svg.i { width: 16px; height: 16px; }
.toprow .grow { flex: 1; }
.tabs { display: flex; gap: 28px; margin-top: 6px; }
.tab { padding: 8px 2px 10px; color: var(--text2); border-bottom: 2px solid transparent; font-size: 15px; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
#menuBtn { display: none; }

#body { flex: 1; display: flex; min-height: 0; }
#center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#chat { flex: 1; overflow-y: auto; }
#fm { flex: 1; overflow-y: auto; display: none; }
body.tab-files #fm { display: block; }
body.tab-files #chat, body.tab-files #composer { display: none; }
.col { max-width: 900px; margin: 0 auto; padding: 24px 28px 12px; }
.empty { color: var(--muted); text-align: center; margin-top: 20vh; }
.empty b { display: block; color: var(--text); font-size: 22px; margin-bottom: 6px; }

/* 对话内容 */
.md { word-wrap: break-word; margin: 12px 0; }
.md p { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; font-size: 16px; }
.md ul, .md ol { margin: 6px 0 10px; padding-left: 24px; }
.md li { margin: 2px 0; }
.md blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--text2); }
.md a { color: var(--accent); }
.md .tblwrap { overflow-x: auto; margin: 8px 0 12px; }
.md table { border-collapse: collapse; font-size: 14px; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--code); font-weight: 600; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 10px; overflow-x: auto; white-space: pre; margin: 8px 0; }
.md code.inl { background: var(--code); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.user { display: flex; flex-direction: column; align-items: flex-end; margin: 22px 0 12px; }
.user .bubble { background: var(--bubble); padding: 10px 18px; border-radius: 20px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; }
.user .meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 13px; }
.act { margin: 2px 0; }
.act .row { display: flex; align-items: center; gap: 8px; min-height: 34px; color: var(--text2); cursor: pointer; border-radius: 6px; padding: 0 4px; margin: 0 -4px; }
.act .row:hover { background: var(--hover); }
.act .row svg.i { width: 16px; height: 16px; color: var(--muted); }
.act .verb { flex-shrink: 0; }
.act .dot { color: var(--muted); flex-shrink: 0; }
.act .sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act .st { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; }
.act .st .okc { color: var(--ok); } .act .st .bad { color: var(--bad); }
.act .dl { color: var(--accent); display: inline-flex; }
.act .detail { display: none; margin: 4px 0 10px 28px; }
.act.open .detail { display: block; }
.act .detail pre { background: var(--code); border-radius: 8px; padding: 10px 12px; margin: 4px 0; white-space: pre-wrap; word-break: break-all; max-height: 360px; overflow: auto; }
.act .detail .lbl { color: var(--muted); font-size: 12px; }
.act.think .sum { color: var(--text2); }
.act.think .detail { white-space: pre-wrap; color: var(--text2); font-size: 14px; }
.fail { display: flex; align-items: baseline; gap: 8px; margin: 10px 0; }
.fail .d { color: var(--bad); }
.fail b { color: var(--bad); font-weight: 600; flex-shrink: 0; }
.fail .msg { flex: 1; }
.fail .code { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
.done { color: var(--muted); font-size: 12.5px; margin: 8px 0 18px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.livestat { display: flex; align-items: center; gap: 8px; color: var(--accent); margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14.5px; }
.livestat svg.i { width: 16px; height: 16px; }
.resume { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); background: var(--accent-soft); border-radius: 12px; padding: 10px 12px 10px 14px; margin: 10px 0 16px; }
.resume svg.i { color: var(--accent); }
.resume .rt { flex: 1; min-width: 200px; }
.resume .rt b { display: block; font-weight: 600; }
.resume .rt span { color: var(--text2); font-size: 13.5px; }
.resume.gone { background: none; color: var(--muted); }
.autotag { color: var(--accent); }
.sess .lead svg.i { width: 14px; height: 14px; color: var(--accent); }
.perm { border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.perm pre { white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; background: var(--code); padding: 8px 10px; border-radius: 8px; margin: 8px 0; }
.perm .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.perm .res { color: var(--muted); font-size: 13px; }

/* 项目文件管理 */
.fmcol { max-width: 1000px; margin: 0 auto; padding: 18px 28px 40px; }
.fmhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.fmws { color: var(--text); font-weight: 600; border: 1px solid var(--border); }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; color: var(--text2); font-size: 14px; min-width: 0; }
.crumbs button { padding: 2px 6px; border-radius: 6px; color: var(--text2); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs .sep { color: var(--muted); }
.fmtools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.fmtools .btn { display: inline-flex; align-items: center; gap: 6px; }
.fmtools .btn svg.i { width: 16px; height: 16px; }
.fmtools .btn:disabled { opacity: .45; cursor: default; }
#fview { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--panel); }
#fview.drag { border-color: var(--accent); background: var(--accent-soft); }
.flist .fr { display: grid; grid-template-columns: 22px 1fr 90px 90px 110px; align-items: center; gap: 10px; padding: 0 12px; min-height: 44px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }
.flist .fr:last-child { border-bottom: 0; }
.flist .fr:hover { background: var(--hover); }
.flist .fr.hd { cursor: default; color: var(--muted); font-size: 12.5px; min-height: 36px; background: var(--side); }
.flist .fr svg.i { width: 18px; height: 18px; color: var(--muted); }
.flist .fr.d > svg.i { color: var(--accent); }
.flist .fn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flist .fs, .flist .ft { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.flist .fa { display: flex; justify-content: flex-end; gap: 2px; opacity: 0; }
.flist .fr:hover .fa { opacity: 1; }
.flist .fa .iconbtn { width: 30px; height: 30px; }
.flist .fa .iconbtn.del:hover { color: var(--bad); }
.fempty, .ferr { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.ferr { color: var(--bad); }
#fUploads:empty { display: none; }
#fUploads { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.fup { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); }
.fup .barw { flex: 1; height: 6px; background: var(--code); border-radius: 3px; overflow: hidden; max-width: 260px; }
.fup .barw div { height: 100%; background: var(--accent); }
.prev { padding: 0; }
.prevhead { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--border); background: var(--side); }
.prevhead .pn { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prevhead .pm { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.prev pre { margin: 0; padding: 14px 16px; white-space: pre-wrap; word-break: break-all; max-height: 70vh; overflow: auto; font-size: 13px; line-height: 1.55; }
.prev .img { padding: 16px; text-align: center; }
.prev .img img { max-width: 100%; max-height: 70vh; border-radius: 8px; }
.prev .note { padding: 28px 16px; text-align: center; color: var(--muted); }

/* 输入框 */
#composer { padding: 6px 28px 10px; }
.box { max-width: 900px; margin: 0 auto; border: 1px solid var(--border); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); padding: 12px 12px 10px 16px; }
.box.drag { border-color: var(--accent); background: var(--accent-soft); }
#atts { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.att { display: inline-flex; align-items: center; gap: 6px; background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px 4px 10px; font-size: 13px; max-width: 260px; }
.att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .pg { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.att.err { border-color: var(--bad); color: var(--bad); }
.att button { color: var(--muted); display: inline-flex; }
#input { width: 100%; border: 0; outline: none; background: transparent; resize: none; min-height: 48px; max-height: 260px; padding: 2px 0; line-height: 1.6; }
#input::placeholder { color: var(--muted); }
.bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.bar .grow { flex: 1; }
.plus { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; }
.plus:hover { border-color: var(--accent); color: var(--accent); }
.pick { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 8px; border-radius: 8px; color: var(--text2); }
.pick:hover { background: var(--hover); }
.pick select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pick svg.i { width: 16px; height: 16px; }
.pick.danger { color: var(--bad); }
#sendBtn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
#sendBtn:disabled { opacity: .4; cursor: default; }
#sendBtn svg.i { width: 20px; height: 20px; }
#sendBtn.stop svg.i { fill: #fff; stroke: none; width: 14px; height: 14px; }
#stats { max-width: 900px; margin: 8px auto 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 28px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
#stats .chip svg.i { width: 15px; height: 15px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 50; max-width: 90vw; }
#toast.err { background: var(--bad); color: #fff; }
#backdrop { display: none; }

@media (max-width: 900px) {
  #side { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; margin-left: 0 !important; transform: translateX(-100%); transition: transform .2s; }
  #app.side-open #side { transform: none; }
  #app.side-open #backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; }
  .fmcol { padding: 12px 12px 30px; }
  .fmtools .bl { display: none; }
  .fmtools .btn { width: 40px; justify-content: center; padding: 0; }
  .flist .fr { grid-template-columns: 22px 1fr auto; }
  .flist .ft, .flist .fr.hd { display: none; }
  .flist .fs { display: none; }
  .flist .fa { opacity: 1; }
  .modal { padding: 0; }
  .mbox { height: 100%; border-radius: 0; }
  .mhead { padding: 14px 10px 6px 16px; }
  .mhead h2 { font-size: 18px; }
  /* 手机上左侧分类变成顶部可横向滑动的一排 */
  .mbody { flex-direction: column; gap: 0; padding: 0; }
  .mnav { width: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 4px 12px 10px; gap: 6px; flex-shrink: 0; scrollbar-width: none; }
  .mnav button { width: auto; flex-shrink: 0; padding: 8px 14px; font-size: 14px; gap: 8px; border-radius: 999px; background: var(--hover); }
  .mnav button .i { width: 16px; height: 16px; }
  .mnav button.on { background: var(--accent-soft); color: var(--accent); }
  .mnav button.on .i { color: var(--accent); }
  .sp { padding: 4px 12px 40px; }
  .srow { padding: 8px 0 14px; margin-bottom: 14px; }
  .kpis { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .kpi .kv { font-size: 19px; }
  .chart, .xlab { margin-left: 40px; }
  .chart { height: 160px; }
  #menuBtn { display: inline-flex; }
  #sideToggle { display: none; }
  .chips .opt { display: none; }
  #top { padding: 8px 12px 0; }
  .col { padding: 16px 16px 8px; }
  #composer { padding: 4px 10px calc(8px + env(safe-area-inset-bottom)); }
  .user .bubble { max-width: 92%; }
  /* 手机上模式和模型只显示图标，点图标照样能选 */
  .pick .plabel, .pick .pchev { display: none; }
  .pick { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }
  .pick svg.i { width: 19px; height: 19px; }
  #input { min-height: 28px; }
  #stats { gap: 2px 16px; font-size: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">

    </div>
  </aside>
  <div id="backdrop"></div>

  <section id="main">
    <header id="top">
      <div class="toprow">

    <div id="body">
      <div id="center">
        <div id="chat"><div class="col" id="chatCol"></div></div>
        <div id="fm">
          <div class="fmcol">
            <div class="fmhead">
              <label class="pick fmws" title="切换工作区"><span data-i="folder"></span><span id="fmWsLabel"></span><span data-i="chevronDown"></span><select id="fmWs"></select></label>

            </div>
            <div class="fmtools">
              <button class="btn" id="fUp" title="上一级"><span data-i="arrowUpLeft"></span><span class="bl">上一级</span></button>
              <button class="btn" id="fRefresh" title="刷新"><span data-i="refresh"></span><span class="bl">刷新</span></button>
              <button class="btn" id="fMkdir" title="新建文件夹"><span data-i="folderPlus"></span><span class="bl">新建文件夹</span></button>
              <button class="btn primary" id="fUpload" title="上传文件"><span data-i="upload"></span><span class="bl">上传</span></button>
              <input type="file" id="fUploadInput" multiple hidden>
            </div>
            <div id="fUploads"></div>
            <div id="fview">
              <div class="flist" id="flist"></div>
            </div>
          </div>
        </div>
        <div id="composer">
          <div class="box" id="box">
            <div id="atts"></div>
            <textarea id="input" rows="1" placeholder="发消息给 Claude，Enter 发送，Shift+Enter 换行；可以拖入或粘贴文件"></textarea>
            <div class="bar">
              <button class="plus" id="attachBtn" title="上传文件" data-i="plus"></button>
              <input type="file" id="fileInput" multiple hidden>
              <label class="pick" id="modePick"><span data-i="shield"></span><span id="modeLabel" class="plabel">标准模式</span><span data-i="chevronDown" class="pchev"></span>
                <select id="modeSel">
                  <option value="default">标准模式（每次操作都询问）</option>
                  <option value="acceptEdits">自动接受编辑</option>
                  <option value="plan">计划模式（只规划不执行）</option>

    </div>
  </section>
</div>
<div id="toast"></div>

</div>

      <nav class="mnav" id="statsNav"></nav>
      <div class="sp" id="sp"></div>
    </div>
  </div>
</div>

// 心跳：手机锁屏、切后台、换网络后，连接常常已经断了但浏览器还以为连着，发出去的请求石沉大海。
// 定时 ping，收不到回应就立刻换一条新连接；页面回到前台时马上检查一次。
let lastRx = 0, pingTimer = null, reconnectTimer = null;
function connect() {
  clearTimeout(reconnectTimer);
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(`${proto}://${location.host}/ws`);
  ws = sock;
  sock.onopen = () => {
    lastRx = Date.now();
    send({ type: 'list' });
    // 断线期间没加载成的历史，重新请求
    for (const c of chats.values()) if (c.sessionId && !c.loaded) send({ type: 'history', sessionId: c.sessionId });
  };
  sock.onclose = async (e) => {
    if (ws !== sock) return; // 已经换成新连接了
    if (e.code === 4001) { location.replace('/login'); return; }
    const me = await fetch('/api/me').then((r) => r.json()).catch(() => null);
    if (me && !me.authed) { location.replace('/login'); return; }
    for (const c of chats.values()) c.running = false;
    renderAll();
    toast('连接断开，正在重连…', true);
    reconnectTimer = setTimeout(connect, 2000);
  };
  sock.onmessage = (e) => { if (ws !== sock) return; lastRx = Date.now(); const m = JSON.parse(e.data); if (m.type !== 'pong') handle(m); };
}
// 丢掉当前连接（不等它慢慢超时），马上重连
function reconnectNow() {
  const old = ws; ws = null;
  if (old) { old.onclose = old.onmessage = old.onopen = null; try { old.close(); } catch {} }
  for (const c of chats.values()) c.running = false;
  connect();
}
// 发 ping，timeout 毫秒内没收到任何消息就认为连接已死
function checkAlive(timeout) {

}

// 精简版 markdown：代码块、表格、标题、列表、引用、粗体、行内代码、链接
// 全部用 DOM + textContent 生成，不拼 HTML，防 XSS
function inline(target, text) {
  const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) target.append(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) target.append(el('code', 'inl', m[1].slice(1, -1)));
    else if (m[2]) target.append(el('strong', null, m[2].slice(2, -2)));
    else { const a = el('a', null, m[3]); a.href = m[4]; a.target = '_blank'; a.rel = 'noopener noreferrer'; target.append(a); }
    last = re.lastIndex;
  }
  if (last < text.length) target.append(document.createTextNode(text.slice(last)));
}
function renderText(target, text) {
  target.replaceChildren();
  const lines = String(text).split('\n');
  let para = [];
  const flush = () => { if (!para.length) return; const p = el('p'); para.forEach((l, i) => { if (i) p.append(el('br')); inline(p, l); }); target.append(p); para = []; };
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((x) => x.trim());
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      flush(); const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      target.append(el('pre', null, code.join('\n'))); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] || '')) {
      flush(); const t = el('table'); const hr = el('tr');
      for (const c of cells(l)) { const th = el('th'); inline(th, c); hr.append(th); }
      t.append(hr); i++;
      for (i++; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) { const tr = el('tr'); for (const c of cells(lines[i])) { const td = el('td'); inline(td, c); tr.append(td); } t.append(tr); }
      i--; const w = el('div', 'tblwrap'); w.append(t); target.append(w); continue;
    }
    let m;
    if ((m = /^(#{1,4})\s+(.*)/.exec(l))) { flush(); const h = el('h' + Math.min(6, m[1].length + 2)); inline(h, m[2]); target.append(h); continue; }
    if ((m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(l))) {
      flush(); const ordered = /\d/.test(m[1]); const list = el(ordered ? 'ol' : 'ul');
      for (; i < lines.length && (m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(lines[i])); i++) { const li = el('li'); inline(li, m[2]); list.append(li); }
      i--; target.append(list); continue;
    }
    if ((m = /^>\s?(.*)/.exec(l))) { flush(); const q = el('blockquote'); inline(q, m[1]); target.append(q); continue; }
    if (!l.trim()) { flush(); continue; }
    para.push(l);
  }
  flush();
}
function relPath(c, p) {

}

// 渲染一条完整消息（历史记录和实时消息共用）
function renderMessage(c, target, m) {
  const { role, content, at } = m;
  if (m.id && m.usage) c.usage.set(m.id, m.usage);
  // 不是用户打的字：系统标签、中断提示、读长图时的尺寸说明、技能说明
  const skip = (t) => !t || t.startsWith('<') || t.startsWith('[Request interrupted') || /^\[Image: (original \d+x\d+|source: )/.test(t) || t.startsWith('Base directory for this skill:');
  if (role === 'user') {
    if (typeof content === 'string') { if (!skip(content)) addUser(c, target, content, at); return; }
    for (const b of content || []) {
      if (b.type === 'tool_result') addToolResult(c, b, at);
      else if (b.type === 'text' && !skip(b.text)) addUser(c, target, b.text, at);
    }
    return;
  }
  for (const b of content || []) {
    if (b.type === 'thinking') {
      if (c.liveThink) { c.liveThink.update(b.thinking || c.liveThink.raw); c.liveThink = null; }
      else if (b.thinking) addThinking(c, target, b.thinking);
    } else if (b.type === 'text') {
      if (c.liveThink) c.liveThink = null;
      if (c.live) { c.live.classList.remove('typing'); renderText(c.live, b.text); c.live = null; }
      else { const d = el('div', 'md'); renderText(d, b.text); target.append(d); }
    } else if (b.type === 'tool_use') {
      c.liveThink = null;
      addToolUse(c, target, b, at);
    }
  }
}

// ================= 处理服务端消息 =================
function chatFor(m) {
  let c = chats.get(m.chatId);
  if (!c) {
    const s = S.sessions.find((x) => x.sessionId === m.sessionId);
    const first = m.events?.find((e) => e.type === 'run_start');
    c = makeChat(m.chatId, m.sessionId || null, m.cwd || first?.cwd, s?.title || first?.text.slice(0, 40));
  }
  return c;
}
function handle(m) {
  if (m.type === 'hello') { S.clockOffset = Date.now() - m.serverTime; return; }
  if (m.type === 'toast') { toast(m.message, m.level === 'error'); return; }
  if (m.type === 'resume_scheduled') {
    S.resumes.set(m.chatId, m);
    const c = chatFor(m);
    if (!c.sessionId) c.sessionId = m.sessionId;
    showResumeCard(c, m);
    renderTree();
    return;
  }
  if (m.type === 'resume_cleared') {
    S.resumes.delete(m.chatId);
    const c = chats.get(m.chatId);
    if (c?.resumeCard) {
      if (m.why === 'cancelled') { c.resumeCard.className = 'resume gone'; c.resumeCard.replaceChildren(icon('x'), el('span', null, '已取消自动继续')); }
      else c.resumeCard.remove();
      c.resumeCard = null;
    }
    renderTree();
    return;
  }
  if (m.type === 'sessions') {
    S.workspaces = m.workspaces; S.defaultWs = m.defaultWorkspace; S.sessions = m.sessions; S.discovered = m.discovered;
    if (!S.workspaces.includes(S.curWs)) S.curWs = S.defaultWs;
    for (const c of chats.values()) { const s = S.sessions.find((x) => x.sessionId === c.sessionId); if (s && c.title === '新会话') c.title = s.title; }
    renderAll();
    return;
  }
  if (m.type === 'history') {
    const c = chatBySession(m.sessionId);
    if (!c || c.loaded) return; // 重连时可能收到重复的历史，只渲染一次
    c.loaded = true;
    let msgs = m.messages;
    if (c.running && c.runText) {
      const isStart = (x) => x.role === 'user' && (typeof x.content === 'string' ? x.content === c.runText : (x.content || []).some((b) => b.type === 'text' && b.text === c.runText));
      for (let i = msgs.length - 1; i >= 0; i--) if (isStart(msgs[i])) { msgs = msgs.slice(0, i); break; }
    }
    const frag = el('div');
    for (const msg of msgs) renderMessage(c, frag, msg);
    c.root.querySelector('.empty')?.remove();
    c.root.prepend(frag);
    if (c === current) { renderAll(); scrollDown(true); }
    return;
  }
  if (m.type === 'replay') {
    const c = chatFor(m);
    if (c.runEl) c.runEl.remove();
    c.runEl = null; c.live = null; c.liveThink = null;
    for (const ev of m.events) handleRun(c, ev);
    if (!current || (current !== c && !current.sessionId && !current.root.querySelector('.user'))) show(c);
    renderAll();
    return;
  }
  if (m.chatId) handleRun(chatFor(m), m);
}
function handleRun(c, m) {
  const t = () => c.runEl;
  switch (m.type) {
    case 'run_start':
      c.startedAt = m.startedAt; c.stats = null; c.contextUsed = null; c.runMode = m.mode; c.cwd = m.cwd || c.cwd;
      c.root.querySelector('.empty')?.remove();
      c.runEl = el('div'); c.root.append(c.runEl);
      addUser(c, c.runEl, m.text, m.startedAt);
      if (m.auto) c.runEl.querySelector('.user .meta').prepend(el('span', 'autotag', '⏵ 额度恢复后自动发送'));
      c.liveStat = el('div', 'livestat'); c.liveStat.append(icon('send'), el('span', null, 'Claude 工作中 …'));
      c.runEl.append(c.liveStat);
      c.running = true; c.runText = m.text;
      if (c.title === '新会话') c.title = m.text.slice(0, 40);
      break;
    case 'session':
      c.sessionId = m.sessionId;
      if (m.version) $('ver').textContent = 'Claude Code ' + m.version;
      break;
    case 'think':
      if (!c.liveThink) { c.liveThink = addThinking(c, t(), ''); c.liveThink.raw = ''; t().append(c.liveStat); }
      c.liveThink.raw += m.text; c.liveThink.update(c.liveThink.raw);
      break;
    case 'delta':
      if (!c.live) { c.live = el('div', 'md typing'); c.live._raw = ''; t().append(c.live, c.liveStat); }
      c.live._raw += m.text; renderText(c.live, c.live._raw);
      break;
    case 'message':
      renderMessage(c, t(), m); t().append(c.liveStat);
      break;
    case 'stats':
      c.stats = m; if (m.contextUsed) c.contextUsed = m.contextUsed; break;
    case 'permission_request':
      addPermission(c, t(), m); t().append(c.liveStat); break;
    case 'permission_resolved': {
      const d = document.getElementById('perm-' + c.chatId + '-' + m.id);
      if (d) d.querySelector('.btns')?.replaceWith(el('div', 'res', m.label));
      break;
    }
    case 'result': {
      c.lastResult = m; c.lastTps = m.tps;
      if (m.contextUsed) c.contextUsed = m.contextUsed;
      if (m.contextWindow) { c.contextWindow = m.contextWindow; S.contextWindow = m.contextWindow; store.set('ctxWin', m.contextWindow); }
      if (m.ok) {
        const d = el('div', 'done');
        const parts = [`✓ 完成`, `耗时 ${fmtMs(m.durationMs)}`, `首字 ${fmtMs(m.ttftMs)}`, `输入 ${fmtTok(m.inputTokens)}${m.cacheReadTokens ? `（缓存 ${fmtTok(m.cacheReadTokens)}）` : ''}`, `输出 ${fmtTok(m.outputTokens)}`, m.tps ? `${m.tps.toFixed(1)} tok/s` : null, m.apiCalls > 1 ? `API ${m.apiCalls} 次` : null, m.sessionCost ? `会话累计 $${m.sessionCost.toFixed(4)}` : null];
        for (const p of parts) if (p) d.append(el('span', null, p));
        t().append(d);
      } else addFail(t(), m.errorText || '运行出错', m.error);
      break;
    }
    case 'error':
      addFail(t() || c.root, m.message); break;
    case 'run_end':
      if (c.live) { c.live.classList.remove('typing'); c.live = null; }
      c.liveThink = null;
      c.liveStat?.remove(); c.liveStat = null;
      if (m.aborted) t().append(el('div', 'done', '已停止'));
      for (const tool of c.tools.values()) if (!tool.done) { tool.st.querySelector('.spin')?.remove(); tool.done = true; }
      c.running = false;
      send({ type: 'list' });
      setTimeout(() => loadLimits(), 1500); // 跑完一轮，限额会变
      if (statsOpen()) loadUsageStats();
      break;
  }
  if (c === current) {
    if (['run_start', 'run_end', 'session', 'message', 'result'].includes(m.type)) renderAll(); else renderStats();
    scrollDown();
  } else if (['run_start', 'run_end'].includes(m.type)) renderTree();
}

const atts = []; // { name, size, status: 'up'|'ok'|'err', path, pct, xhr, el }

// 上传一个文件到 dir，onProgress(百分比)，返回服务器上的完整路径
function uploadTo(dir, file, onProgress, holder) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    if (holder) holder.xhr = xhr;
    xhr.open('POST', `/api/upload?dir=${encodeURIComponent(dir)}&name=${encodeURIComponent(file.name)}`);
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress?.(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => {
      let r = {}; try { r = JSON.parse(xhr.responseText); } catch { /* ignore */ }
      if (xhr.status === 200) resolve(r); else reject(new Error(r.error || `上传失败（${xhr.status}）`));
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.onabort = () => reject(new Error('已取消'));
    xhr.send(file);
  });
}
function attachFiles(files) {
  const cwd = current?.cwd || S.curWs;
  const dir = cwd.replace(/[\\/]+$/, '') + (cwd.includes('\\') ? '\\' : '/') + 'uploads';
  for (const file of files) {
    const a = { name: file.name, size: file.size, status: 'up', pct: 0 };
    atts.push(a);
    uploadTo(dir, file, (p) => { a.pct = p; renderAtts(); }, a)
      .then((r) => { a.status = 'ok'; a.path = r.path; a.name = r.name; })
      .catch((e) => { a.status = 'err'; if (e.message !== '已取消') toast(`${file.name}：${e.message}`, true); })
      .finally(() => { renderAtts(); renderComposer(); });
  }
  renderAtts(); renderComposer();
}

const PLAN_NAME = { pro: 'Pro 套餐', max: 'Max 套餐', team: 'Team 套餐', enterprise: 'Enterprise 套餐' };
// 剩余时间 = 服务器读取时算好的剩余 - 读取之后过去的时间（用服务器时钟换算，不依赖各端时钟）
function resetText(w, fetchedAt) {
  if (w.resetsInMs == null) return '';
  const serverNow = Date.now() - S.clockOffset;
  const ms = w.resetsInMs - Math.max(0, serverNow - fetchedAt);
  if (!(ms > 0)) return '即将重置';
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  if (h < 24) return `${h ? h + ' 小时 ' : ''}${m} 分钟后重置`;
  const d = Math.floor(h / 24);
  return `${d} 天 ${h % 24} 小时后重置`;
}
let limits = null;

}

    p.append(qqRow('工作区', 'QQ 上的对话在哪个目录里运行', qqSelect(S.workspaces.map((w) => [w, w]), qq.cwd, (v) => qqDo({ op: 'settings', cwd: v }, '已保存'))));
    p.append(qqRow('权限', 'QQ 发起的对话用什么权限模式。不是“完全权限”时，需要确认的操作会在 QQ 里问你', qqSelect([...$('modeSel').options].map((o) => [o.value, o.textContent]), qq.mode, (v) => {
      if (v === 'bypassPermissions' && !confirm('完全权限下，Claude 执行命令、改文件都不再询问。确定用于 QQ 吗？')) return qqRender();
      qqDo({ op: 'settings', mode: v }, '已保存');
    })));
    p.append(qqRow('模型', '默认模型；每个 QQ 会话也可以用 /model 单独切换', qqSelect([...$('modelSel').options].map((o) => [o.value, o.textContent]), qq.model, (v) => qqDo({ op: 'settings', model: v }, '已保存'))));
    p.append(qqRow('Markdown 消息', '需要机器人在 QQ 开放平台申请到 Markdown 权限，没有权限时请保持关闭（会自动去掉 Markdown 记号）', qqSwitch(qq.markdown, (v) => qqDo({ op: 'settings', markdown: v }, '已保存'))));
    p.append(el('div', 'sec-title', 'QQ 里可用的命令'));
    const cmds = el('div', 'plist');
    for (const [c, d] of [['/new', '开始新会话（清空上下文）'], ['/stop', '停止当前任务'], ['/status', '查看当前会话状态'], ['/model', '查看或切换模型（opus / sonnet / haiku / fable / default）'], ['/help', '查看所有命令']]) { const it = el('div', 'pi'); const g = el('div', 'grow'); g.append(el('div', null, c), el('div', 'sub', d)); it.append(g); cmds.append(it); }
    p.append(cmds);
  }
  p.scrollTop = keepScroll;
}
qqLoad();

for (const tab of document.querySelectorAll('.tab')) tab.onclick = () => setTab(tab.dataset.tab);

// ================= 项目文件管理 =================
const fm = { dir: null, root: null, parent: null };
const sepOf = (p) => (String(p).includes('\\') ? '\\' : '/');
const joinPath = (dir, name) => dir.replace(/[\\/]+$/, '') + sepOf(dir) + name;
const insideRoot = (p, root) => Boolean(p && root) && (p.toLowerCase() === root.toLowerCase() || p.toLowerCase().startsWith(root.replace(/[\\/]+$/, '').toLowerCase() + sepOf(root)));
async function api(op, body) {
  const r = await fetch('/api/fs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, ...body }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `操作失败（${r.status}）`);
  return data;
}
function renderWsPicker() {
  const sel = $('fmWs'); sel.replaceChildren();
  for (const w of S.workspaces) { const o = el('option', null, w); o.value = w; sel.append(o); }
  if (fm.root) sel.value = fm.root;
  $('fmWsLabel').textContent = baseName(fm.root || '');
}
$('fmWs').onchange = (e) => loadFiles(e.target.value);
function renderCrumbs() {
  const box = $('crumbs'); box.replaceChildren();
  if (!fm.dir || !fm.root) return;
  const rel = fm.dir.slice(fm.root.replace(/[\\/]+$/, '').length).split(/[\\/]/).filter(Boolean);
  let acc = fm.root;
  rel.forEach((seg) => {
    acc = joinPath(acc, seg);
    const target = acc;
    box.append(el('span', 'sep', '/'));
    const b = el('button', null, seg); b.onclick = () => loadFiles(target);
    box.append(b);
  });
}
async function loadFiles(dir) {
  const view = $('fview');
  const list = el('div', 'flist'); list.id = 'flist';
  try {
    const r = await fetch('/api/files?path=' + encodeURIComponent(dir || ''));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    Object.assign(fm, { dir: data.path, root: data.root, parent: data.parent });
    renderWsPicker(); renderCrumbs();
    $('fUp').disabled = !fm.parent;
    const hd = el('div', 'fr hd');
    hd.append(el('span'), el('span', null, '名称'), el('span', 'fs', '大小'), el('span', 'ft', '修改时间'), el('span'));
    list.append(hd);
    if (!data.entries.length) list.append(el('div', 'fempty', '空文件夹。可以把文件拖到这里上传。'));
    for (const e of data.entries) list.append(fileRow(e, joinPath(data.path, e.name)));
  } catch (err) {
    list.append(el('div', 'ferr', '读取失败：' + err.message));
  }
  view.replaceChildren(list);
}
function fileRow(e, full) {
  const row = el('div', 'fr' + (e.dir ? ' d' : ''));
  row.append(icon(e.dir ? 'folder' : 'file'), el('span', 'fn', e.name), el('span', 'fs', e.dir ? '' : fmtSize(e.size)), el('span', 'ft', ago(e.mtime)));
  row.title = e.name;
  const acts = el('span', 'fa');
  const btn = (ic, title, fn, cls) => { const b = el('button', 'iconbtn' + (cls ? ' ' + cls : '')); b.title = title; b.append(icon(ic)); b.onclick = (ev) => { ev.stopPropagation(); fn(); }; acts.append(b); };
  if (!e.dir) {
    const a = el('a', 'iconbtn'); a.href = dlUrl(full); a.setAttribute('download', e.name); a.title = '下载'; a.append(icon('download'));
    a.onclick = (ev) => ev.stopPropagation();
    acts.append(a);
  }
  btn('edit', '重命名', async () => {
    const name = prompt('新名称', e.name);
    if (!name || name === e.name) return;
    try { await api('rename', { path: full, name }); toast('已重命名'); loadFiles(fm.dir); } catch (err) { toast(err.message, true); }
  });
  btn('x', '删除', async () => {
    if (!confirm(`确定永久删除${e.dir ? '文件夹（包括里面所有内容）' : '文件'}“${e.name}”吗？删除后无法恢复。`)) return;
    try { await api('delete', { path: full }); toast('已删除'); loadFiles(fm.dir); } catch (err) { toast(err.message, true); }
  }, 'del');
  row.append(acts);
  row.onclick = () => (e.dir ? loadFiles(full) : previewFile(full));
  return row;
}
async function previewFile(full) {
  const view = $('fview');
  const box = el('div', 'prev');
  const head = el('div', 'prevhead');
  const back = el('button', 'iconbtn'); back.title = '返回列表'; back.append(icon('arrowUpLeft')); back.onclick = () => loadFiles(fm.dir);
  const name = el('span', 'pn', baseName(full));
  const meta = el('span', 'pm', '');
  const dl = el('a', 'btn'); dl.href = dlUrl(full); dl.setAttribute('download', baseName(full)); dl.append(icon('download'), document.createTextNode(' 下载'));
  dl.style.display = 'inline-flex'; dl.style.alignItems = 'center'; dl.style.textDecoration = 'none'; dl.style.color = 'inherit';
  head.append(back, name, meta, dl);
  box.append(head);
  view.replaceChildren(box);
  try {
    const r = await fetch('/api/preview?path=' + encodeURIComponent(full));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    meta.textContent = `${fmtSize(d.size)} · ${ago(d.mtime)}前修改`.replace('刚刚前', '刚刚');
    if (d.kind === 'text') {
      box.append(el('pre', null, d.text + (d.truncated ? '\n\n…（文件太大，只显示前 1MB，完整内容请下载）' : '')));
    } else if (d.kind === 'image') {
      const w = el('div', 'img'); const img = el('img'); img.alt = d.name; img.src = '/api/raw?path=' + encodeURIComponent(full); w.append(img); box.append(w);
    } else box.append(el('div', 'note', '这个文件不能预览，可以下载后查看。'));
  } catch (err) {
    box.append(el('div', 'ferr', '预览失败：' + err.message));
  }
}
$('fUp').onclick = () => fm.parent && loadFiles(fm.parent);
$('fRefresh').onclick = () => loadFiles(fm.dir);
$('fMkdir').onclick = async () => {
  const name = prompt('新文件夹名称');
  if (!name) return;
  try { await api('mkdir', { path: fm.dir, name }); loadFiles(fm.dir); } catch (err) { toast(err.message, true); }
};
$('fUpload').onclick = () => $('fUploadInput').click();
$('fUploadInput').onchange = (e) => { fmUpload([...e.target.files]); e.target.value = ''; };
async function fmUpload(files) {
  const dir = fm.dir;
  const box = $('fUploads');
  await Promise.all(files.map(async (f) => {
    const row = el('div', 'fup'); const bar = el('div', 'barw'); const fill = el('div'); fill.style.width = '0%'; bar.append(fill);
    const pct = el('span', null, '0%');
    row.append(icon('upload'), el('span', null, f.name), bar, pct);
    box.append(row);
    try { await uploadTo(dir, f, (p) => { fill.style.width = p + '%'; pct.textContent = p + '%'; }); }
    catch (err) { toast(`${f.name}：${err.message}`, true); }
    row.remove();
  }));
  if (fm.dir === dir) loadFiles(dir);
}
const fview = $('fview');
fview.addEventListener('dragover', (e) => { e.preventDefault(); fview.classList.add('drag'); });
fview.addEventListener('dragleave', () => fview.classList.remove('drag'));
fview.addEventListener('drop', (e) => { e.preventDefault(); fview.classList.remove('drag'); if (e.dataTransfer.files.length && fm.dir) fmUpload([...e.dataTransfer.files]); });

boot();
</script>
